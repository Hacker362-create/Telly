# infra/prometheus.yml
# Prometheus scrape configuration for the Telly platform.
# The backend exposes /metrics in standard Prometheus text format.

global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'telly-backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: /metrics
