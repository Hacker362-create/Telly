# telly-signaling-deployment.yaml
# Kubernetes deployment for the stateless Node.js signaling servers.
# Uses Redis cluster for session sharing across replicas.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: telly-signaling
  namespace: telly
  labels:
    app: telly-signaling
    tier: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: telly-signaling
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: telly-signaling
        tier: backend
    spec:
      containers:
        - name: telly-signaling
          image: telly/signaling:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: telly-secrets
                  key: DATABASE_URL
            - name: REDIS_HOST
              valueFrom:
                secretKeyRef:
                  name: telly-secrets
                  key: REDIS_HOST
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: telly-secrets
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: telly-secrets
                  key: JWT_SECRET
            - name: MPESA_CONSUMER_KEY
              valueFrom:
                secretKeyRef:
                  name: telly-secrets
                  key: MPESA_CONSUMER_KEY
            - name: MPESA_CONSUMER_SECRET
              valueFrom:
                secretKeyRef:
                  name: telly-secrets
                  key: MPESA_CONSUMER_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: telly-signaling-svc
  namespace: telly
spec:
  selector:
    app: telly-signaling
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3000
  type: LoadBalancer
